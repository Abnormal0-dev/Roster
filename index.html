<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roster — Squad Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4C6FFF">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Roster">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@daily-co/daily-js"></script>
<style>
  :root {
    --bg: #12141A;
    --surface: #1B1E26;
    --surface-raised: #242832;
    --border: #323847;
    --text-primary: #EDEFF3;
    --text-secondary: #8B92A5;
    --text-tertiary: #5C6273;
    --brand: #4C6FFF;
    --brand-dim: #35407A;
    --status-in: #34D399;
    --status-out: #64748B;
    --status-pending: #FBBF24;
    --danger: #F2555A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--text-primary);
    font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    /* Depth instead of flat black: a faint cool wash from the top, plus a subtle
       diagonal weave so large empty areas have texture rather than dead space. */
    background:
      radial-gradient(1100px 520px at 50% -10%, rgba(255,255,255,0.055), transparent 70%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.014) 0 1px, transparent 1px 7px),
      var(--bg);
    background-attachment: fixed;
  }
  .display { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: 0.005em; }
  .tabular { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select, textarea {
    font-family: inherit; color: inherit; background: var(--surface-raised);
    border: 1px solid var(--border); border-radius: 8px; padding: 11px 13px; font-size: 16px; width: 100%;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); background: var(--surface); }

  /* Rank badges carry each game's own tier color, so rank is readable at a glance. */
  .rank-badge {
    display: inline-flex; align-items: center; font-size: 12px; font-weight: 700;
    letter-spacing: 0.01em; border: 1px solid; border-radius: 6px; padding: 3px 9px;
    font-variant-numeric: tabular-nums;
  }
  .rank-badge.small { font-size: 10px; padding: 2px 7px; }

  .app { max-width: 640px; margin: 0 auto; padding: 20px 18px 40px; }
  .body-row { display: flex; flex-direction: column; }
  .main-col { min-width: 0; flex: 1; }

  header.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  header.top .wordmark { font-size: 22px; }
  header.top .wordmark .dot { color: var(--brand); }
  header.top .subtitle { font-size: 12px; color: var(--text-tertiary); }
  .me-chip {
    display: flex; align-items: center; gap: 8px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 20px; padding: 6px 12px 6px 6px; font-size: 13px;
  }
  .me-chip .avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

  .brand-banner {
    position: relative; overflow: hidden; margin: 0 0 16px; padding: 18px;
    border: 1px solid #34405F; border-radius: 14px;
    background: radial-gradient(500px 180px at 90% 0%, var(--banner-glow, rgba(76,111,255,.28)), transparent 65%), linear-gradient(135deg, var(--banner-start, #171B27), var(--banner-end, #20283A));
  }
  .brand-banner::after { content:''; position:absolute; width:180px; height:180px; right:-70px; top:-80px; border:1px solid rgba(255,255,255,.08); border-radius:50%; box-shadow:0 0 0 28px rgba(255,255,255,.025),0 0 0 56px rgba(255,255,255,.018); }
  .brand-banner .eyebrow { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--brand); font-weight:800; }
  .brand-banner .headline { font-family:'Barlow Condensed',sans-serif; font-size:30px; line-height:1; margin:5px 0 5px; }
  .brand-banner .copy { font-size:12px; color:var(--text-secondary); max-width:360px; line-height:1.45; }
  .brand-banner .mark { position:absolute; right:20px; bottom:12px; font-family:'Barlow Condensed',sans-serif; font-size:54px; font-weight:700; color:rgba(255,255,255,.06); }
  .tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 4px; margin-bottom: 18px; }
  .tabs button { flex: 1; text-align: center; padding: 9px; font-size: 13px; font-weight: 600; border-radius: 7px; color: var(--text-secondary); }
  .tabs button.active { background: var(--brand); color: #fff; }

  .btn-primary { background: var(--brand); color: white; border-radius: 8px; padding: 12px 20px; font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-primary:active { opacity: 0.85; }
  .btn-secondary { background: var(--surface-raised); border: 1px solid var(--border); color: var(--text-secondary); border-radius: 8px; padding: 10px 16px; font-size: 13px; font-weight: 600; }

  .empty-state { text-align: center; padding: 50px 20px; color: var(--text-secondary); }
  .empty-state .display { font-size: 24px; color: var(--text-primary); margin-bottom: 8px; }
  .empty-state p { font-size: 14px; max-width: 340px; margin: 0 auto 20px; line-height: 1.5; }

  .fab { margin: 22px 0 4px; }
  .fab .btn-primary { width: 100%; box-shadow: 0 8px 24px var(--brand-dim); }

  .squad-card { background: linear-gradient(180deg, var(--surface), rgba(0,0,0,0.12)); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; position: relative; overflow: hidden; }
  /* A thin brand-colored spine on each squad card — reads as a team stripe on a jersey. */
  .squad-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--brand); opacity: 0.85; }
  .squad-card .name { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .squad-card .meta { font-size: 12px; color: var(--text-secondary); }
  .streak-pill { display: flex; align-items: baseline; gap: 4px; background: var(--surface-raised); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px; }
  .streak-pill .num { font-size: 20px; line-height: 1; }
  .streak-pill .label { font-size: 10px; color: var(--text-tertiary); }
  .in-badge { font-size: 10px; color: var(--status-in); background: rgba(52,211,153,0.12); border: 1px solid var(--status-in); border-radius: 10px; padding: 2px 8px; margin-left: 8px; }

  .back-row { display: flex; align-items: center; margin-bottom: 16px; }
  .back-row button { color: var(--text-secondary); font-size: 14px; }
  .back-row button:hover { color: var(--text-primary); }

  .squad-header .display { font-size: 28px; margin-bottom: 4px; }
  .squad-header .roster-names { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }

  .streak-hero { background: linear-gradient(160deg, var(--surface), rgba(0,0,0,0.2)); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .streak-hero .streak-num { font-size: 64px; line-height: 0.9; color: var(--brand); text-shadow: 0 0 34px var(--brand-dim); }
  .streak-hero .streak-label { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .streak-hero .confirm-btn { background: var(--surface-raised); border: 1px solid var(--border); border-radius: 8px; padding: 11px 16px; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 110px; }
  .streak-hero .confirm-btn.done { background: rgba(52,211,153,0.12); border-color: var(--status-in); color: var(--status-in); }
  .streak-hero .confirm-btn small { font-weight: 400; color: var(--text-tertiary); font-size: 10px; }

  .section-label { font-size: 12px; color: var(--text-secondary); margin: 20px 0 8px; display: flex; align-items: center; justify-content: space-between; }

  .member-row { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 11px 13px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
  .member-row .who { display: flex; align-items: center; gap: 10px; }
  .member-row .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-raised); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--text-secondary); border: 1px solid var(--border); }
  .member-row .mname { font-size: 14px; font-weight: 500; }
  .member-row .mmeta { font-size: 11px; color: var(--text-tertiary); }
  .status-pill { font-size: 11px; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border); }
  .status-pill.in { background: rgba(52,211,153,0.12); border-color: var(--status-in); color: var(--status-in); }
  .status-pill.out { background: rgba(100,116,139,0.15); border-color: var(--status-out); color: var(--text-secondary); }
  .status-toggle { display: flex; gap: 4px; }
  .status-toggle button { font-size: 11px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-tertiary); }
  .status-toggle button.active-in { background: rgba(52,211,153,0.12); border-color: var(--status-in); color: var(--status-in); }
  .status-toggle button.active-out { background: rgba(100,116,139,0.15); border-color: var(--status-out); color: var(--text-secondary); }

  .sub-pool { background: var(--surface); border: 1px dashed var(--border); border-radius: 8px; padding: 12px; margin-bottom: 8px; }
  .sub-pool .sub-row { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; font-size: 13px; }
  .sub-pool .sub-row + .sub-row { border-top: 1px solid var(--border); }
  .add-inline { display: flex; gap: 8px; margin-top: 8px; }
  .add-inline input { font-size: 13px; padding: 8px 10px; }
  .add-inline button { background: var(--surface-raised); border: 1px solid var(--border); border-radius: 6px; padding: 8px 14px; font-size: 13px; color: var(--text-secondary); white-space: nowrap; }
  .remove-x { color: var(--text-tertiary); font-size: 15px; padding: 2px 6px; }
  .remove-x:hover { color: var(--danger); }

  .chat-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; height: 320px; overflow: hidden; }
  .chat-msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .chat-msg { display: flex; gap: 8px; }
  .chat-msg .avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--surface-raised); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--text-secondary); flex-shrink: 0; }
  .chat-msg .body { font-size: 13px; }
  .chat-msg .uname { font-weight: 600; margin-right: 6px; }
  .chat-msg .time { font-size: 10px; color: var(--text-tertiary); margin-left: 6px; }
  .chat-msg .text { color: var(--text-primary); display: block; margin-top: 2px; line-height: 1.4; }
  .chat-input-row { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); }
  .chat-input-row input { font-size: 16px; }
  .chat-input-row button { background: var(--brand); color: #fff; border-radius: 6px; padding: 0 16px; font-size: 13px; font-weight: 600; }
  .chat-empty { color: var(--text-tertiary); font-size: 13px; text-align: center; padding: 20px 0; }

  .board-post { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px; }
  .board-post .who { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .board-post .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-raised); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--text-secondary); border: 1px solid var(--border); }
  .board-post .uname { font-size: 14px; font-weight: 600; }
  .board-post .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .board-post .tag { font-size: 11px; background: var(--surface-raised); border: 1px solid var(--border); border-radius: 12px; padding: 3px 10px; color: var(--text-secondary); }
  .board-post .note { font-size: 13px; color: var(--text-primary); line-height: 1.5; }
  .board-post.mine { border-color: var(--brand-dim); }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch { width: 36px; height: 36px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .swatch.selected { border-color: var(--text-primary); }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px 16px 0 0; padding: 22px 20px 30px; width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; }
  .modal .display { font-size: 20px; margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-actions button { flex: 1; padding: 13px; border-radius: 8px; font-size: 14px; font-weight: 600; }
  .btn-cancel { background: var(--surface-raised); border: 1px solid var(--border); color: var(--text-secondary); }
  @media (min-width: 480px) { .overlay { align-items: center; } .modal { border-radius: 16px; } }

  .loading-line { color: var(--text-tertiary); font-size: 13px; text-align: center; padding: 30px 0; }
  .gear-btn { color: var(--text-secondary); font-size: 18px; padding: 6px; }

  .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: var(--surface-raised); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; font-size: 13px; z-index: 50; box-shadow: 0 8px 20px rgba(0,0,0,0.4); max-width: 90%; text-align: center; }
  .toast.error { border-color: var(--danger); color: var(--danger); }

  .rank-row { display: flex; gap: 8px; }
  .rank-row select { flex: 1; }
  .rank-tag { font-size: 11px; background: var(--surface-raised); border: 1px solid var(--brand-dim); color: var(--brand); border-radius: 12px; padding: 3px 10px; font-weight: 600; }
  .mmeta-rank { font-size: 11px; color: var(--text-tertiary); }

  /* ---- Design pass: motion, depth, icons ---- */
  @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes modalUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .app-content { animation: fadeSlideUp 0.28s ease both; }
  .overlay { animation: overlayIn 0.18s ease both; }
  .modal { animation: modalUp 0.26s cubic-bezier(0.2,0.8,0.3,1) both; }
  @media (min-width: 480px) { .modal { animation: popIn 0.22s cubic-bezier(0.2,0.8,0.3,1) both; } }


  /* ---- Social/profile/reels responsive UI ---- */
  .app { max-width: 1180px; padding: 24px 24px 96px; }
  .social-profile { background: var(--surface); border:1px solid var(--border); border-radius:18px; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,.22); }
  .social-cover { height:150px; position:relative; background:radial-gradient(600px 220px at 80% 0%, var(--profile-glow, rgba(76,111,255,.4)), transparent 65%), linear-gradient(135deg,var(--profile-start,#171B27),var(--profile-end,#20283A)); }
  .social-cover:after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.25)); pointer-events:none; }
  .profile-main { padding:0 28px 28px; }
  .profile-head { display:flex; gap:22px; align-items:flex-end; margin-top:-54px; position:relative; z-index:2; }
  .profile-big-avatar { width:108px; height:108px; border-radius:50%; border:5px solid var(--surface); background:var(--surface-raised); object-fit:cover; flex-shrink:0; }
  .profile-title { min-width:0; padding-bottom:7px; flex:1; }
  .profile-title h1 { margin:0 0 4px; font-size:30px; line-height:1; }
  .profile-title .handle { color:var(--text-secondary); font-size:13px; }
  .profile-bio { color:var(--text-secondary); font-size:14px; line-height:1.45; margin:12px 0 0; max-width:700px; }
  .profile-actions { display:flex; gap:8px; padding-bottom:7px; }
  .profile-stats { display:flex; gap:34px; margin:22px 0 18px; }
  .profile-stat { display:flex; flex-direction:column; gap:2px; cursor:pointer; }
  .profile-stat strong { font-size:20px; }
  .profile-stat span { color:var(--text-secondary); font-size:12px; }
  .profile-tabs { display:flex; border-top:1px solid var(--border); margin:0 -28px; padding:0 28px; }
  .profile-tab { flex:0 0 150px; padding:15px 12px; text-align:center; color:var(--text-secondary); border-bottom:2px solid transparent; font-weight:700; }
  .profile-tab.active { color:var(--text-primary); border-color:var(--brand); }
  .clip-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; padding-top:18px; }
  .clip-tile { aspect-ratio:9/12; border-radius:10px; overflow:hidden; background:#0d0f14; border:1px solid var(--border); position:relative; cursor:pointer; }
  .clip-tile video,.clip-tile img { width:100%; height:100%; object-fit:cover; display:block; }
  .clip-tile .clip-overlay { position:absolute; inset:auto 0 0; padding:22px 10px 10px; background:linear-gradient(transparent,rgba(0,0,0,.85)); }
  .clip-tile .clip-name { font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .clip-tile .clip-likes { font-size:11px; color:#fff; margin-top:3px; }
  .reels-shell { display:grid; grid-template-columns:minmax(0,760px) 300px; gap:18px; justify-content:center; }
  .reels-feed { display:flex; flex-direction:column; gap:16px; }
  .reel-card { min-height:620px; max-height:calc(100vh - 120px); background:#08090c; border:1px solid var(--border); border-radius:18px; overflow:hidden; position:relative; display:flex; justify-content:center; }
  .reel-card video { width:100%; height:100%; max-height:calc(100vh - 120px); object-fit:contain; background:#000; }
  .reel-side { position:absolute; right:14px; bottom:88px; display:flex; flex-direction:column; gap:10px; align-items:center; }
  .reel-action { width:46px; height:46px; border-radius:50%; background:rgba(0,0,0,.62); border:1px solid rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center; font-size:18px; }
  .reel-action span { font-size:10px; margin-top:48px; position:absolute; white-space:nowrap; }
  .reel-meta { position:absolute; left:18px; right:80px; bottom:18px; text-shadow:0 2px 8px #000; }
  .reel-meta .creator { font-weight:800; font-size:15px; }
  .reel-meta .caption { color:#eee; font-size:13px; margin-top:5px; line-height:1.4; }
  .reels-sidebar { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px; height:max-content; position:sticky; top:18px; }
  .bottom-nav { position:fixed; z-index:30; left:50%; bottom:14px; transform:translateX(-50%); width:min(680px,calc(100% - 24px)); display:flex; gap:5px; padding:7px; background:rgba(18,20,26,.94); backdrop-filter:blur(18px); border:1px solid var(--border); border-radius:18px; box-shadow:0 14px 40px rgba(0,0,0,.35); }
  .bottom-nav button { flex:1; padding:9px 8px; border-radius:12px; color:var(--text-secondary); font-size:11px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .bottom-nav button.active { color:#fff; background:var(--brand); }
  .upload-drop { border:1px dashed var(--border); border-radius:12px; padding:18px; text-align:center; background:rgba(255,255,255,.02); }
  .upload-preview { width:100%; max-height:280px; border-radius:10px; object-fit:contain; background:#000; margin-top:10px; }
  @media (max-width:760px){
    .app{max-width:680px;padding:14px 12px 88px}.social-cover{height:118px}.profile-main{padding:0 16px 20px}.profile-head{gap:12px}.profile-big-avatar{width:88px;height:88px}.profile-title h1{font-size:23px}.profile-actions{position:absolute;right:0;top:62px}.profile-stats{gap:22px}.profile-tabs{margin:0 -16px;padding:0 16px}.profile-tab{flex:1}.clip-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.reels-shell{display:block}.reels-sidebar{display:none}.reel-card{min-height:calc(100vh - 130px);max-height:none;border-radius:12px}.reel-card video{max-height:none}.bottom-nav{bottom:8px}.top .subtitle{display:none}
  }
  @media (min-width:1000px){.body-row{flex-direction:row;gap:20px}.main-col{min-width:0}.brand-banner{margin-bottom:18px}.clip-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}

  .icon { width: 16px; height: 16px; flex-shrink: 0; display: inline-block; vertical-align: middle; }
  .icon-sm { width: 13px; height: 13px; }

  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  .squad-card, .board-post, .member-row { box-shadow: 0 1px 0 rgba(0,0,0,0.2), 0 4px 14px -8px rgba(0,0,0,0.5); transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease; }
  .squad-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px -6px rgba(0,0,0,0.55); }
  .squad-card:active { transform: translateY(0); }

  .btn-primary { transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:active { transform: scale(0.97); }
  .btn-secondary, .btn-cancel { transition: background 0.15s ease, border-color 0.15s ease; }
  .btn-secondary:hover, .btn-cancel:hover { border-color: var(--brand-dim); color: var(--text-primary); }

  .status-toggle button, .tabs button { transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease; }
  .status-toggle button:active { transform: scale(0.95); }

  .fab .btn-primary { display: flex; align-items: center; justify-content: center; gap: 8px; }

  .streak-hero { position: relative; overflow: hidden; }
  .streak-hero::before {
    content: ''; position: absolute; top: -40%; right: -15%; width: 200px; height: 200px; border-radius: 50%;
    background: radial-gradient(circle, var(--brand-dim) 0%, transparent 70%); opacity: 0.5; pointer-events: none;
  }
  .streak-hero .streak-num-row { display: flex; align-items: center; gap: 10px; }

  .day-chip { transition: transform 0.15s ease; }
  .day-chip.in { box-shadow: 0 0 0 1px var(--status-in) inset; }

  .member-row .avatar, .board-post .avatar, .chat-msg .avatar { box-shadow: 0 0 0 2px var(--surface); }

  /* Chat bubbles */
  .chat-msg.mine { flex-direction: row-reverse; }
  .chat-msg .bubble { background: var(--surface-raised); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px; max-width: 78%; }
  .chat-msg.mine .bubble { background: var(--brand-dim); border-color: var(--brand); border-bottom-right-radius: 4px; }
  .chat-msg:not(.mine) .bubble { border-bottom-left-radius: 4px; }
  .chat-msg .uname { display: block; font-size: 11px; opacity: 0.75; margin-bottom: 2px; }
  .chat-msg.mine .uname { text-align: right; }
  .chat-msg .time { display: block; font-size: 10px; color: var(--text-tertiary); margin-top: 2px; }
  .chat-msg.mine .time { text-align: right; }

  .empty-state svg { margin-bottom: 14px; opacity: 0.6; }

  .back-row button { display: inline-flex; align-items: center; gap: 6px; }
  .section-label { align-items: center; gap: 6px; }
  .day-chip.inactive { opacity: 0.45; }
  .day-chip.inactive .status-dot { background: transparent; border-color: var(--border); }
  .day-chip.out .status-dot { background: var(--danger); border-color: var(--danger); }
  .section-label .icon { color: var(--text-tertiary); }
  .ad-banner { border: 1px solid var(--status-pending); background: linear-gradient(135deg, rgba(251,191,36,0.16), rgba(251,191,36,0.06)); border-radius: 10px; padding: 16px; margin-bottom: 16px; text-align: center; box-shadow: 0 0 0 1px rgba(251,191,36,0.15); }
  .ad-banner .ad-tag { font-size: 11px; color: var(--status-pending); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
  .ad-banner .ad-msg { font-size: 15px; color: var(--text-primary); font-weight: 600; margin: 8px 0; }
  .ad-banner .ad-upgrade { font-size: 13px; color: var(--brand); font-weight: 700; }
  .pro-badge { font-size: 10px; background: rgba(76,111,255,0.15); border: 1px solid var(--brand); color: var(--brand); border-radius: 10px; padding: 2px 8px; margin-left: 6px; font-weight: 700; }
  .danger-link { color: var(--danger); font-size: 12px; background: none; border: none; padding: 4px 0; }
  .danger-link:hover { text-decoration: underline; }
  .benefit-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 14px; }
  .benefit-row .icon { color: var(--status-in); }

  /* Desktop / web layout: sidebar navigation instead of a mobile tab bar.
     Placed last on purpose — these overrides need to win the cascade against
     the mobile rules above them, which they can't do from earlier in the file. */
  @keyframes splashFade { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }
  @keyframes splashRise { from { opacity: 0; transform: translateY(10px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
  #call-view {
    position: fixed; inset: 0; z-index: 300; background: #000;
    display: flex; flex-direction: column;
  }
  #call-frame-container { flex: 1; min-height: 0; }
  #call-frame-container iframe { width: 100%; height: 100%; border: none; }
  .call-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .call-topbar .call-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
  .call-leave-btn { background: var(--danger); color: #fff; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 600; }
  .call-loading { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); font-size: 14px; flex-direction: column; gap: 12px; }

  #splash {
    position: fixed; inset: 0; z-index: 200; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
  }
  #splash.done { animation: splashFade 0.4s ease forwards; pointer-events: none; }
  .splash-inner { text-align: center; animation: splashRise 0.5s cubic-bezier(0.2,0.8,0.3,1) both; }
  .splash-mark { width: 84px; height: 84px; margin-bottom: 14px; }
  .splash-word { font-size: 34px; letter-spacing: 0.01em; }
  .splash-tag { font-size: 13px; color: var(--text-tertiary); margin-top: 2px; }

  @media (min-width: 900px) {
    .app { max-width: 1040px; padding: 28px 32px 48px; }
    .body-row { flex-direction: row; gap: 32px; align-items: flex-start; }
    .tabs { flex-direction: column; width: 200px; flex-shrink: 0; position: sticky; top: 28px; padding: 8px; gap: 2px; }
    .tabs button { text-align: left; padding: 11px 14px; }
    .modal { max-width: 480px; }
  }

  .profile-tabs button { font: inherit; color: inherit; }
  .clip-save-button { position:absolute; right:8px; bottom:8px; z-index:3; width:32px; height:32px; border-radius:50%; background:rgba(0,0,0,.65); color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; }
</style>
</head>
<body>
<div id="splash">
  <div class="splash-inner">
    <svg class="splash-mark" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M100,28 C75,60 62,95 66,125 C69,152 83,176 100,176 C117,176 131,152 134,125 C138,95 125,60 100,28 Z" fill="#4C6FFF"/>
      <path d="M100,72 C89,90 83,107 85,122 C87,137 93,148 100,148 C107,148 113,137 115,122 C117,107 111,90 100,72 Z" fill="#12141A" opacity="0.35"/>
    </svg>
    <div class="display splash-word">Roster<span style="color:#4C6FFF;">.</span></div>
    <div class="splash-tag">Squads that actually show up</div>
  </div>
</div>
<div id="app" class="app"></div>
<div id="call-view" style="display:none;"></div>
<script>
(function() {
  const DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const COLOR_SWATCHES = ['#4C6FFF','#34D399','#F2555A','#FBBF24','#A855F7','#22D3EE','#F97316','#EC4899'];
  const AV = (name) => (name || '?').trim().slice(0,2).toUpperCase();
  const displayNameOf = (user) => String((user && user.displayName) || (typeof user === 'string' ? user : (user && user.username)) || '?');
  // Renders a real profile picture if one is set, falling back to initials —
  // used everywhere an avatar shows up so pictures work consistently.
  function avatarEl(pub, sizePx) {
    const size = sizePx || 30;
    if (pub && pub.avatarUrl) {
      const img = document.createElement('img');
      img.src = pub.avatarUrl;
      img.style.cssText = `width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;border:1px solid var(--border);flex-shrink:0;`;
      img.onerror = () => { const fallback = initialsEl(pub.username, size); img.replaceWith(fallback); };
      return img;
    }
    return initialsEl(pub && pub.username, size);
  }
  function initialsEl(username, sizePx) {
    const size = sizePx || 30;
    return el('div', { class: 'avatar', style: `width:${size}px;height:${size}px;font-size:${Math.round(size*0.4)}px;flex-shrink:0;`, text: AV(username) });
  }

  // Multi-game rank system. Each game defines its own tiers, whether those tiers
  // have divisions, and (for Overwatch) whether ranks are tracked per role.
  const GAMES = {
    'Overwatch 2': {
      tiers: ['Bronze','Silver','Gold','Platinum','Emerald','Diamond','Master','Grandmaster','Champion','Top 500'],
      noDivision: ['Top 500'],
      divisions: [5,4,3,2,1],
      roles: ['Tank','Damage','Support'], subLabel: 'Role',
      // Rank is tracked separately per input pool — a PC skill rating and a
      // console skill rating exist even on the same account, so both need a home.
      platforms: ['PC', 'Console'],
      idLabel: 'BattleTag', idPlaceholder: 'Name#1234'
    },
    'Fortnite': {
      tiers: ['Bronze','Silver','Gold','Platinum','Diamond','Elite','Champion','Unreal','Unreal Legends'],
      noDivision: ['Elite','Champion','Unreal','Unreal Legends'],
      divisions: [3,2,1],
      // Battle Royale and Zero Build now share one ranked ladder; Reload has its
      // own, separate one — so these are tracked as two distinct tracks.
      roles: ['Ranked (Battle Royale/Zero Build)', 'Ranked Reload'], subLabel: 'Ranked mode',
      idLabel: 'Epic username', idPlaceholder: 'Your Epic Games username'
    },
    'Apex Legends': {
      tiers: ['Rookie','Bronze','Silver','Gold','Platinum','Diamond','Master','Predator'],
      noDivision: ['Master','Predator'],
      divisions: [4,3,2,1],
      roles: null,
      idLabel: 'EA/Origin ID', idPlaceholder: 'Your EA account name'
    },
    'Valorant': {
      tiers: ['Iron','Bronze','Silver','Gold','Platinum','Diamond','Ascendant','Immortal','Radiant'],
      noDivision: ['Radiant'],
      divisions: [3,2,1],
      roles: null,
      idLabel: 'Riot ID', idPlaceholder: 'Name#TAG'
    },
    'Rocket League': {
      tiers: ['Bronze','Silver','Gold','Platinum','Diamond','Champion','Grand Champion','Supersonic Legend'],
      noDivision: ['Supersonic Legend'],
      divisions: [3,2,1],
      roles: null,
      idLabel: 'Epic/PSN/Xbox ID', idPlaceholder: 'Your platform username'
    },
    'NBA 2K': {
      tiers: ['Unranked','Bronze','Silver','Gold','Platinum','Diamond','Elite'],
      noDivision: ['Unranked','Elite'],
      divisions: [3,2,1],
      roles: null,
      idLabel: '2K username', idPlaceholder: 'Your 2K / console username'
    },
    'FIFA': {
      tiers: ['Unranked','Bronze','Silver','Gold','Elite','Division 1'],
      noDivision: ['Unranked','Division 1'],
      divisions: [3,2,1],
      roles: null,
      idLabel: 'EA username', idPlaceholder: 'Your EA / FC username'
    }
  };
  const GAME_NAMES = Object.keys(GAMES);

  // Kept for backwards compatibility with profiles saved before multi-game existed.
  const RANK_TIERS = GAMES['Overwatch 2'].tiers;
  const DIVISIONED_TIERS = RANK_TIERS.filter(t => t !== 'Top 500');
  const ROLES = GAMES['Overwatch 2'].roles;

  // Rank tier colors pulled from the games' own visual language — bronze reads as
  // bronze, diamond as ice, master as purple. This encodes real information
  // (how high someone is) rather than decorating.
  // Recognition badges an admin can grant — separate from Pro, which is billing status.
  // Update log — add a new entry (newest first) whenever a real update ships.
  // The version string just needs to increase; it's what "seen the latest" is tracked against.
  const CHANGELOG = [
    { version: 11, date: 'Sept 2026', title: 'Community tools & player profiles', notes: [
      'Added Discord community integration',
      'Added online/DND/offline status controls and activity streaks',
      'Added looking-for status, recent games, block/report tools, and board filters',
      'Added richer profile activity and social controls'
    ]},
    { version: 10, date: 'Sept 2026', title: 'Roster social upgrade', notes: [
      'Added username search directly inside Friends & Requests',
      'Added NBA 2K and FIFA to game profiles and squad matching',
      'Added a configurable Tip Jar entry',
      'Added a refreshed visual asset kit for Discord and social posts'
    ]},
    { version: 9, date: 'Sept 2026', title: 'Password visibility & recognition badges', notes: [
      'Show/hide toggle on password fields during signup and sign-in',
      'Tester and Editor badges an admin can grant to show who\'s contributing',
      'This update log'
    ]},
    { version: 8, date: 'Sept 2026', title: 'Faster navigation, fewer blank screens', notes: [
      'Fixed a bug where switching screens briefly cleared the whole app',
      'Added a reminder to include your username when paying for Pro'
    ]},
    { version: 7, date: 'Sept 2026', title: 'Real in-app calling & push notifications', notes: [
      'Calls now happen inside Roster instead of opening another site',
      'Real push notifications for calls, messages, and friend requests',
      'Tapping a call notification joins you directly instead of through the menu',
      'Quick access to Friends & Requests from the top bar'
    ]},
    { version: 6, date: 'Sept 2026', title: 'Multi-game ranks', notes: [
      'Added Fortnite, Apex Legends, Valorant, and Rocket League alongside Overwatch',
      'Overwatch now tracks PC and console rank separately',
      'Fortnite tracks Ranked and Ranked Reload separately',
      'Find a Squad listings now show the right rank for whichever game you pick'
    ]},
    { version: 5, date: 'Sept 2026', title: 'Real accounts and your own domain', notes: [
      'Username + password accounts that work across devices',
      'Moved off the Claude link onto its own hosted domain',
      'Profile pictures, friend requests, private messages, and favorites'
    ]}
  ];
  const LATEST_CHANGELOG_VERSION = CHANGELOG[0].version;

  const BADGES = {
    tester: { label: 'TESTER', color: '#22D3EE' },
    editor: { label: 'EDITOR', color: '#F472B6' }
  };
  function badgeEl(type) {
    const b = BADGES[type];
    if (!b) return null;
    return el('span', { class: 'pro-badge', style: 'border-color:' + b.color + '; color:' + b.color + '; background:' + b.color + '26;', text: b.label });
  }
  function badgeRow(pub) {
    const badges = (pub && pub.badges) || [];
    return badges.map(t => badgeEl(t)).filter(Boolean);
  }

  const TIER_COLORS = {
    'Rookie': '#7C6F64', 'Iron': '#6B6560', 'Bronze': '#B0713C', 'Silver': '#9BA3AD',
    'Gold': '#E0A62B', 'Platinum': '#3FC8C0', 'Emerald': '#2FB268', 'Diamond': '#5AA9F0',
    'Elite': '#C77DFF', 'Ascendant': '#22C55E', 'Master': '#A855F7', 'Immortal': '#E0447B',
    'Grandmaster': '#F2555A', 'Champion': '#F0B429', 'Predator': '#E63946', 'Radiant': '#FFE066',
    'Unreal': '#B14CFF', 'Unreal Legends': '#FF7A1A', 'Grand Champion': '#8B5CF6',
    'Supersonic Legend': '#F472B6', 'Top 500': '#FFD166'
  };
  function tierColor(rank) {
    if (!rank || !rank.tier) return 'var(--text-tertiary)';
    return TIER_COLORS[rank.tier] || 'var(--brand)';
  }
  function rankBadge(rank, small) {
    const c = tierColor(rank);
    return el('span', {
      class: 'rank-badge' + (small ? ' small' : ''),
      style: 'color:' + c + '; border-color:' + c + '55; background:' + c + '1A;',
      text: formatRank(rank)
    });
  }

  function formatRank(rank) {
    if (!rank || !rank.tier) return 'Unranked';
    if (rank.division === undefined || rank.division === null) return rank.tier;
    return rank.tier + ' ' + rank.division;
  }
  function formatRoleRanks(roleRanks) {
    const entries = Object.entries(roleRanks || {});
    if (entries.length === 0) return 'No roles set';
    return entries.map(([role, rank]) => role + ' ' + formatRank(rank)).join(' · ');
  }
  // Summarizes everything someone plays: "Overwatch 2 — Tank Gold 3 · Valorant Diamond 2"
  function formatGameRanks(gameRanks) {
    const entries = Object.entries(gameRanks || {});
    if (entries.length === 0) return 'No games set';
    return entries.map(([game, data]) => {
      if (data && data.roleRanks && Object.keys(data.roleRanks).length > 0) {
        return game + ' — ' + formatRoleRanks(data.roleRanks);
      }
      return game + ' ' + formatRank(data && data.rank);
    }).join(' · ');
  }

  // Builds a checklist of roles, each revealing a tier/division picker when checked.
  // initial: { Tank: {tier,division}|null, Damage: ..., Support: ... } — key presence means "plays this role"
  // Lets someone pick a real photo from their phone or computer, resizes/compresses
  // it entirely in the browser (so no upload server is needed), and stores it as a
  // compact data URL — which works as a normal image src, just like a real link.
  // A password input with a show/hide eye toggle — returns the input element
  // itself so callers can use it exactly like any other input (.value works normally).
  function passwordFieldWithToggle(placeholder, styleExtra) {
    const wrap = el('div', { style: 'position:relative; margin-bottom:14px;' + (styleExtra || '') });
    const input = document.createElement('input');
    input.type = 'password';
    input.placeholder = placeholder;
    input.style.cssText = 'padding-right:42px;';
    const toggleBtn = el('button', { type: 'button', style: 'position:absolute; right:4px; top:50%; transform:translateY(-50%); padding:8px; color:var(--text-tertiary);' }, [iconEl('eye')]);
    let visible = false;
    toggleBtn.addEventListener('click', (e) => {
      e.preventDefault();
      visible = !visible;
      input.type = visible ? 'text' : 'password';
      toggleBtn.innerHTML = '';
      toggleBtn.appendChild(iconEl(visible ? 'eyeOff' : 'eye'));
    });
    wrap.appendChild(input);
    wrap.appendChild(toggleBtn);
    return { element: wrap, input };
  }

  function createAvatarPicker(initialUrl) {
    const wrap = document.createElement('div');
    wrap.style.marginBottom = '14px';
    let currentUrl = initialUrl || '';

    const preview = document.createElement('div');
    function renderPreview() {
      preview.innerHTML = '';
      if (currentUrl) {
        const img = document.createElement('img');
        img.src = currentUrl;
        img.style.cssText = 'width:56px;height:56px;border-radius:50%;object-fit:cover;border:1px solid var(--border);';
        preview.appendChild(img);
      } else {
        preview.appendChild(el('div', { class: 'avatar', style: 'width:56px;height:56px;font-size:20px;', text: '?' }));
      }
    }
    renderPreview();

    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.style.display = 'none';

    const chooseBtn = el('button', { class: 'btn-secondary', type: 'button' }, [document.createTextNode('Choose photo')]);
    chooseBtn.addEventListener('click', (e) => { e.preventDefault(); fileInput.click(); });

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file || file.type.indexOf('image/') !== 0) return;
      chooseBtn.textContent = 'Processing…';
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const size = 240;
          const canvas = document.createElement('canvas');
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext('2d');
          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;
          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
          currentUrl = canvas.toDataURL('image/jpeg', 0.75);
          renderPreview();
          chooseBtn.textContent = 'Choose photo';
        };
        img.onerror = () => { showToast('Couldn\'t read that photo — try a different one.', true); chooseBtn.textContent = 'Choose photo'; };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    const previewRow = el('div', { style: 'display:flex; align-items:center; gap:14px; margin-bottom:8px;' });
    previewRow.appendChild(preview);
    previewRow.appendChild(chooseBtn);
    wrap.appendChild(previewRow);
    wrap.appendChild(fileInput);

    const urlInput = el('input', { placeholder: '…or paste an image link instead', style: 'font-size:16px;' });
    urlInput.addEventListener('input', () => { currentUrl = urlInput.value.trim(); });
    wrap.appendChild(urlInput);

    return { element: wrap, getValue: () => currentUrl };
  }

  // Builds a per-game rank picker. Each game is a checkbox; checking it reveals
  // either role-based rank pickers (Overwatch) or a single rank picker (everything else).
  // initial shape: { 'Valorant': { rank: {tier, division} }, 'Overwatch 2': { roleRanks: {...} } }
  function buildGameRankPicker(initial) {
    const wrap = document.createElement('div');
    const state = {};

    function buildTierRow(gameDef, initialRank) {
      const tierSel = document.createElement('select');
      const blank = document.createElement('option');
      blank.value = ''; blank.textContent = 'Unranked';
      tierSel.appendChild(blank);
      gameDef.tiers.forEach(t => {
        const o = document.createElement('option');
        o.value = t; o.textContent = t;
        if (initialRank && initialRank.tier === t) o.selected = true;
        tierSel.appendChild(o);
      });
      const divSel = document.createElement('select');
      gameDef.divisions.forEach(d => {
        const o = document.createElement('option');
        o.value = d; o.textContent = 'Division ' + d;
        if (initialRank && initialRank.division === d) o.selected = true;
        divSel.appendChild(o);
      });
      function syncDiv() {
        const t = tierSel.value;
        divSel.style.display = (t && gameDef.noDivision.indexOf(t) === -1) ? '' : 'none';
      }
      syncDiv();
      tierSel.addEventListener('change', syncDiv);
      const row = el('div', { class: 'rank-row', style: 'margin-top:6px;' }, [tierSel, divSel]);
      return { row, tierSel, divSel, getValue() {
        if (!tierSel.value) return null;
        if (gameDef.noDivision.indexOf(tierSel.value) !== -1) return { tier: tierSel.value };
        return { tier: tierSel.value, division: Number(divSel.value) };
      }};
    }

    function buildRoleBlock(gameDef, existingRoleRanks, keyPrefix, container, controlsTarget) {
      gameDef.roles.forEach(role => {
        const compositeKey = keyPrefix ? (keyPrefix + ' — ' + role) : role;
        const initialRoleRank = existingRoleRanks && existingRoleRanks[compositeKey];
        const playsRole = !!(existingRoleRanks && Object.prototype.hasOwnProperty.call(existingRoleRanks, compositeKey));
        const roleWrap = el('div', { style: 'margin-bottom:8px;' });
        const roleCheck = el('label', { style: 'display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer;' });
        const rcb = document.createElement('input');
        rcb.type = 'checkbox'; rcb.style.width = 'auto'; rcb.checked = playsRole;
        roleCheck.appendChild(rcb);
        roleCheck.appendChild(document.createTextNode(role));
        roleWrap.appendChild(roleCheck);
        const tierCtl = buildTierRow(gameDef, initialRoleRank);
        tierCtl.row.style.display = playsRole ? '' : 'none';
        rcb.addEventListener('change', () => { tierCtl.row.style.display = rcb.checked ? '' : 'none'; });
        roleWrap.appendChild(tierCtl.row);
        container.appendChild(roleWrap);
        controlsTarget[compositeKey] = { rcb, tierCtl };
      });
    }

    GAME_NAMES.forEach(game => {
      const gameDef = GAMES[game];
      const existing = initial && initial[game];
      const plays = !!existing;

      const detail = el('div', { style: 'margin-top:8px;' });
      detail.style.display = plays ? '' : 'none';
      cb.addEventListener('change', () => { detail.style.display = cb.checked ? '' : 'none'; });

      const idInput = el('input', { placeholder: gameDef.idLabel + ' — ' + gameDef.idPlaceholder, style: 'font-size:16px; margin-bottom:8px;', value: (existing && existing.username) || '' });
      detail.appendChild(idInput);

      const gameState = { cb, game, gameDef, idInput };

      if (gameDef.platforms) {
        // Overwatch-style: rank is tracked per platform, and per role within
        // that platform — checking both PC and Console shows two full role sets.
        gameState.roleControls = {};
        gameDef.platforms.forEach(platform => {
          const hasThisPlatform = existing && existing.roleRanks && Object.keys(existing.roleRanks).some(k => k.indexOf(platform + ' — ') === 0);
          const platWrap = el('div', { style: 'margin-bottom:8px; padding:10px; background:var(--surface); border:1px solid var(--border); border-radius:6px;' });
          const platCheck = el('label', { style: 'display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; cursor:pointer;' });
          const pcb = document.createElement('input');
          pcb.type = 'checkbox'; pcb.style.width = 'auto'; pcb.checked = hasThisPlatform;
          platCheck.appendChild(pcb);
          platCheck.appendChild(document.createTextNode(platform));
          platWrap.appendChild(platCheck);
          const platDetail = el('div', { style: 'margin-top:8px;' });
          platDetail.style.display = hasThisPlatform ? '' : 'none';
          pcb.addEventListener('change', () => { platDetail.style.display = pcb.checked ? '' : 'none'; });
          buildRoleBlock(gameDef, existing && existing.roleRanks, platform, platDetail, gameState.roleControls);
          platWrap.appendChild(platDetail);
          detail.appendChild(platWrap);
        });
      } else if (gameDef.roles) {
        gameState.roleControls = {};
        buildRoleBlock(gameDef, existing && existing.roleRanks, null, detail, gameState.roleControls);
      } else {
        gameState.tierCtl = buildTierRow(gameDef, existing && existing.rank);
        detail.appendChild(gameState.tierCtl.row);
      }

      box.appendChild(detail);
      wrap.appendChild(box);
      state[game] = gameState;
    });

    return {
      element: wrap,
      getValue() {
        const result = {};
        GAME_NAMES.forEach(game => {
          const gs = state[game];
          if (!gs.cb.checked) return;
          const username = gs.idInput.value.trim();
          if (gs.roleControls) {
            const roleRanks = {};
            Object.entries(gs.roleControls).forEach(([role, ctl]) => {
              if (ctl.rcb.checked) roleRanks[role] = ctl.tierCtl.getValue();
            });
            result[game] = { roleRanks, username };
          } else {
            result[game] = { rank: gs.tierCtl.getValue(), username };
          }
        });
        return result;
      },
      // Returns the name of the first checked game missing its username, or null
      // if everything checked has one filled in.
      findMissingUsername() {

          const gs = state[game];
          if (gs.cb.checked && !gs.idInput.value.trim()) return game;
        }
        return null;
      }
    };
  }

  function urlBase64ToUint8Array(base64) {
    const padding = '='.repeat((4 - (base64.length % 4)) % 4);
    const b64 = (base64 + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(b64);
    const arr = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    return arr;

  async function startVoiceCall(squadId, notifyUsernames) {
    if (VOICE_BACKEND_URL.indexOf('CHANGE_ME') !== -1) {
      showToast('Voice calling isn\'t connected yet.', true);
      return;
    }
    if (typeof DailyIframe === 'undefined') {
      showToast('Calling didn\'t load — check your connection and try again.', true);
      return;
    }

    const callView = document.getElementById('call-view');
    callView.style.display = 'flex';
    callView.innerHTML = '';
    callView.appendChild(el('div', { class: 'call-topbar' }, [
      el('div', { class: 'call-title', text: 'Connecting…' }),
      el('button', { class: 'call-leave-btn', onclick: () => endVoiceCall() }, [document.createTextNode('Leave')])
    ]));
    const loading = el('div', { class: 'call-loading' }, [
      el('div', { text: 'Setting up the call…' })
    ]);
    callView.appendChild(loading);

    // Real network call — fine here since the app runs on its own real domain
    // now, not inside a sandboxed artifact.
    let roomUrl;
    try {
      const res = await fetch(VOICE_BACKEND_URL + '?squad=' + encodeURIComponent(squadId));
      const data = await res.json();
      if (!data || !data.url) throw new Error(data && data.error);
      roomUrl = data.url;
    } catch (e) {
      endVoiceCall();
      showToast('Couldn\'t start the call — try again.', true);
      return;
    }

    const frameContainer = el('div', { id: 'call-frame-container' });
    callView.innerHTML = '';
    callView.appendChild(el('div', { class: 'call-topbar' }, [
      el('div', { class: 'call-title', text: 'In call' }),
      el('button', { class: 'call-leave-btn', onclick: () => endVoiceCall() }, [document.createTextNode('Leave')])
    ]));
    callView.appendChild(frameContainer);

    try {
      activeCallFrame = DailyIframe.createFrame(frameContainer, {
        showLeaveButton: false,
        iframeStyle: { width: '100%', height: '100%', border: '0' }
      });
      // Explicitly grant camera/mic to the embedded iframe. Daily's SDK usually
      // sets this itself, but a missing "allow" attribute is the most common
      // reason someone's own camera preview looks fine locally while nobody
      // else in the call actually receives their video.
      const rawFrame = activeCallFrame.iframe();
      if (rawFrame) rawFrame.setAttribute('allow', 'camera; microphone; autoplay; display-capture; fullscreen');
      activeCallFrame.on('left-meeting', () => endVoiceCall());
      await activeCallFrame.join({ url: roomUrl, startVideoOff: false, startAudioOff: false });
    } catch (e) {
      endVoiceCall();
      showToast('Couldn\'t join the call — try again.', true);
      return;
    }

    // Best-effort log of who tapped the button and when — not real call analytics
    // (we can't know how long the call ran), just an honest "who started a call" history.
    logCallStart(squadId);
    (notifyUsernames || []).forEach(u => notifyUser(u, profile.username + ' started a call', 'Tap to join', { type: 'call', squadId }));
  }

  function endVoiceCall() {
    if (activeCallFrame) {
      try { activeCallFrame.leave(); activeCallFrame.destroy(); } catch (e) {}
      activeCallFrame = null;
    }
    const callView = document.getElementById('call-view');
    callView.style.display = 'none';
    callView.innerHTML = '';
  }

  function weekKey(date) {
    const d = new Date(date); d.setHours(0,0,0,0);

      modal.appendChild(el('div', { style: 'font-size:15px; line-height:1.5; margin-bottom:20px;', text: message }));

      const okBtn = el('button', { class: 'btn-primary', style: 'background:var(--danger);' }, [document.createTextNode(okLabel || 'Confirm')]);
      cancelBtn.addEventListener('click', () => { overlay.remove(); resolve(false); });
      okBtn.addEventListener('click', () => { overlay.remove(); resolve(true); });

  // ---- storage helpers (with retry so transient errors don't lose writes) ----
  // Shared data (squads, chat, board, etc.) goes to your own free backend, since
  // Claude's storage only works inside a Claude link. Personal data (just your
  // own profile) stays in this browser's localStorage — genuinely private since
  // nothing but this device can read it, no server involved at all.
  async function getKey(key, shared) {
    if (!shared) {
      try {
        const raw = localStorage.getItem('roster-local:' + key);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    }
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const r = await fetch(STORAGE_API_URL + '?key=' + encodeURIComponent(key) + '&t=' + Date.now(), { cache: 'no-store' });
        if (r.status === 404) return null;
        if (!r.ok) throw new Error('bad response');
        const data = await r.json();
        return data.value ? JSON.parse(data.value) : null;
      } catch (e) {
        if (attempt === 0) { await sleep(300); continue; }
        return null;
      }
    }
  }
  async function setKey(key, val, shared) {
    if (!shared) {
      try { localStorage.setItem('roster-local:' + key, JSON.stringify(val)); return true; }
      catch (e) { return false; }
    }
    writing = true;
    try {
      for (let attempt = 0; attempt < 3; attempt++) {
        try {
          const r = await fetch(STORAGE_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key, value: JSON.stringify(val) })
          });
          if (!r.ok) throw new Error('bad response');
          return true;
        } catch (e) {
          if (attempt < 2) { await sleep(900 * (attempt + 1)); continue; }
          console.error('storage set failed', key, e);
          showToast('Couldn\'t save — the app is busy, try again in a moment.', true);
          return false;
        }
      }
    } finally {
      writing = false;
    }
  }

  const MEDIA_UPLOAD_API_URL = 'https://api-theta-rouge-56.vercel.app/api/upload';
  async function uploadVideoFile(file) {
    if (!file || !file.type.startsWith('video/')) throw new Error('Choose a video file.');
    if (file.size > 50 * 1024 * 1024) throw new Error('Video is too large. Keep it under 50 MB.');
    const form = new FormData();
    form.append('file', file);
    const r = await fetch(MEDIA_UPLOAD_API_URL, { method:'POST', body:form });
    const data = await r.json().catch(() => ({}));
    if (!r.ok || !data.url) throw new Error(data.error || 'Video upload failed.');
    return data.url;
  }

  async function delKey(key, shared) {
    if (!shared) {
      try { localStorage.removeItem('roster-local:' + key); } catch (e) {}
      return;
    }
    try { await fetch(STORAGE_API_URL + '?key=' + encodeURIComponent(key), { method: 'DELETE' }); }
    catch (e) {}
  }
  async function listKeys(prefix, shared) {
    if (!shared) {
      try {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.indexOf('roster-local:' + (prefix || '')) === 0) keys.push(k.slice('roster-local:'.length));
        }
        return keys;
      } catch (e) { return []; }
    }
    try {
      const r = await fetch(STORAGE_LIST_API_URL + '?prefix=' + encodeURIComponent(prefix || ''));
      const data = await r.json();
      return data.keys || [];
    } catch (e) { return []; }
  }

  // ---- profile ----
  // The full profile lives in ONE shared record per username (roles, color,
  // avatar, clips, tier, everything) — that's what makes logging in on a second
  // device restore the same account. A remembered username in this browser's
  // localStorage means "stay signed in here"; the password is only checked at
  // register/login/rename time via auth.js.
  function getRememberedUsername() { return localStorage.getItem('roster-remembered-username'); }
  async function loadProfile() {
    const remembered = getRememberedUsername();
    if (!remembered) return null;
    const pub = await getKey('user:' + remembered, true);
    return pub || null;
  }
  async function saveProfile(p) {
    profile = p;
    // Tier lives server-side so an admin can grant it — read it back rather than
    // trusting the local copy, so a profile edit never wipes out a grant.
    const existingPublic = await getKey('user:' + p.username, true);
    profile.tier = (existingPublic && existingPublic.tier) || p.tier || 'free';
    await setKey('user:' + p.username, profile, true);
  }
  async function authCall(body) {
    try {
      const r = await fetch(AUTH_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await r.json();
      return { ok: r.ok, data };
    } catch (e) {
      return { ok: false, data: { error: 'Could not reach the account server.' } };
    }
  }
  function rememberUsername(username) { localStorage.setItem('roster-remembered-username', username); }
  function forgetUsername() { localStorage.removeItem('roster-remembered-username'); }
  async function adminSetTier(username, tier) {
    const existing = (await getKey('user:' + username, true)) || { username };
    existing.tier = tier;
    const ok = await setKey('user:' + username, existing, true);
    if (ok && username === profile.username) profile.tier = tier;
    return ok;
  }
  async function adminToggleBadge(username, badgeType, on) {
    const existing = (await getKey('user:' + username, true)) || { username };
    const badges = new Set(existing.badges || []);
    if (on) badges.add(badgeType); else badges.delete(badgeType);
    existing.badges = Array.from(badges);
    const ok = await setKey('user:' + username, existing, true);
    if (ok && username === profile.username) profile.badges = existing.badges;
    return ok;
  }
  async function fetchPublicUser(username) {
    if (cache.users[username]) return cache.users[username];
    const u = await getKey('user:' + username, true);
    if (u) cache.users[username] = u;
    return u;
  }
  async function isUsernameTaken(username) {
    const u = await getKey('user:' + username, true);
    return !!u;
  }
  async function searchUsers(query) {
    const q = String(query || '').trim().toLowerCase();
    if (!q) return [];
    const keys = await listKeys('user:', true);
    const names = keys.map(k => k.slice(5)).filter(Boolean)
      .filter(u => u !== profile.username);
    const blocked = await fetchBlockedUsers();
    const users = (await Promise.all(names.map(fetchPublicUser))).filter(Boolean);
    return users
      .filter(u => !blocked.includes(u.username))
      .filter(u => {
        const display = displayNameOf(u).toLowerCase();
        const username = String(u.username || '').toLowerCase();
        return display.includes(q) || username.includes(q);
      })
      .sort((a,b) => displayNameOf(a).localeCompare(displayNameOf(b)) || String(a.username).localeCompare(String(b.username)))
      .slice(0, 20);
  }

  async function fetchBlockedUsers() { return (await getKey('blocked:' + profile.username, true)) || []; }
  async function toggleBlockUser(username) {
    const blocked = await fetchBlockedUsers();
    const i = blocked.indexOf(username);
    if (i >= 0) blocked.splice(i, 1); else blocked.push(username);
    await setKey('blocked:' + profile.username, blocked, true);
    return blocked;
  }
  async function reportUser(username, reason) {
    const reports = (await getKey('reports:' + username, true)) || [];
    reports.push({ from: profile.username, reason: reason || 'No reason provided', ts: Date.now() });
    await setKey('reports:' + username, reports.slice(-100), true);
  }
  function activityStreak(p) {
    const last = Number(p?.lastActive || p?.lastSeen || 0);
    if (!last) return 0;
    const days = Math.floor((Date.now() - last) / 86400000);
    return days <= 1 ? Math.max(1, Number(p?.activityStreak || 1)) : 0;
  }

    return { r: parseInt(clean.slice(0,2),16), g: parseInt(clean.slice(2,4),16), b: parseInt(clean.slice(4,6),16) };
  }

  function bannerColor(hex, alpha) {

  function darkenHex(hex, amount) {
    const { r, g, b } = hexToRgb(hex);
    const f = Math.max(0, Math.min(1, amount));

  }

          el('button',{class:'',onclick:()=>{view={screen:'profile'};render();}},[iconEl('plus'),document.createTextNode('Create')]),
          el('button',{class:view.screen==='messages'?'active':'',onclick:()=>{view={screen:'messages'};render();}},[iconEl('message'),document.createTextNode('Inbox')]),
          el('button',{class:view.screen==='profile'?'active':'',onclick:()=>{view={screen:'profile'};render();}},[avatarEl(profile,22),document.createTextNode('Profile')])
        ]); newRoot.appendChild(nav);
      }

    // Now that it's fully built, swap it in as one instant step.
    root.innerHTML = '';
    while (newRoot.firstChild) root.appendChild(newRoot.firstChild);

    setupPolling();
  }

  function setupPolling() {
    if (pollTimer) clearInterval(pollTimer);
    if (profile && profile.dataSaving) return;
    if (view.screen === 'detail' && view.squadId) {
      pollTimer = setInterval(async () => {
        if (view.modal || writing || document.visibilityState !== 'visible') return;
        await fetchSquad(view.squadId);
        await fetchChat(view.squadId);
        if (view.screen === 'detail' && !writing) render();
      }, 18000);
    } else if (view.screen === 'board') {
      pollTimer = setInterval(async () => {
        if (view.modal || writing || document.visibilityState !== 'visible') return;
        await fetchBoard();
        if (view.screen === 'board' && !writing) render();
      }, 20000);
    }
  }

  function renderOnboarding() {
    const wrap = el('div', {});

    wrap.appendChild(header);

    function renderMode() {
      header.innerHTML = '';
      box.innerHTML = '';
      header.appendChild(el('div', { class: 'display', style: 'font-size:30px; margin-bottom:6px;', text: mode === 'create' ? 'Welcome to Roster' : 'Welcome back' }));
      header.appendChild(el('p', { style: 'color:var(--text-secondary); font-size:14px; max-width:320px; margin:0 auto 28px;', text: mode === 'create' ? 'Create an account so you can sign back in from any device.' : 'Sign in with your username and password.' }));

      const nameInput = el('input', { placeholder: 'Username', style: 'margin-bottom:14px;', value: view.loginPrefill || '' });
      const passField = passwordFieldWithToggle('Password');
      const passInput = passField.input;

      if (mode === 'login') {
        const goBtn = el('button', { class: 'btn-primary', style: 'width:100%; padding:14px; margin-bottom:14px;' }, [document.createTextNode('Sign in')]);
        goBtn.addEventListener('click', async () => {
          const name = nameInput.value.trim();
          const pass = passInput.value;
          if (!name || !pass) { showToast('Enter your username and password.', true); return; }
          goBtn.textContent = 'Signing in…';
          const result = await authCall({ action: 'login', username: name, password: pass });
          if (!result.ok) {
            goBtn.textContent = 'Sign in';
            showToast(result.data.error || 'Sign in failed.', true);
            return;
          }
          const pub = await getKey('user:' + name, true);
          rememberUsername(name);
          profile = pub || { username: name, color: COLOR_SWATCHES[0], roleRanks: {}, battleTag: '' };
          if (profile.color) applyTheme(profile.color);
          startHeartbeat();
          render();
          maybePromptForNotifications();
        });
        const switchLink = el('button', { style: 'width:100%; text-align:center; color:var(--brand); font-size:13px; padding:6px;', onclick: () => { mode = 'create'; renderMode(); } }, [document.createTextNode('New here? Create an account')]);
        box.appendChild(el('div', { style: 'text-align:center;' }, [nameInput, passField.element, goBtn, switchLink]));
        return;
      }

      // create mode
      const confirmField = passwordFieldWithToggle('Confirm password', ' margin-bottom:18px;');
      const confirmInput = confirmField.input;
      const btInputOnboard = el('input', { placeholder: 'BattleTag — Name#1234 (optional)', style: 'margin-bottom:18px;' });
      const avatarPicker = createAvatarPicker('');

      const gameLabel = el('div', { style: 'font-size:13px; font-weight:600; margin-bottom:4px; text-align:left;', text: 'Games you play' });
      const gameHint = el('div', { style: 'font-size:12px; color:var(--text-tertiary); margin-bottom:8px; text-align:left;', text: 'Pick at least one, plus your rank in it.' });
      const gamePicker = buildGameRankPicker({});

      const platLabel = el('div', { style: 'font-size:13px; font-weight:600; margin:16px 0 4px; text-align:left;', text: 'Platforms you play on' });
      const platHint = el('div', { style: 'font-size:12px; color:var(--text-tertiary); margin-bottom:8px; text-align:left;', text: 'Pick at least one.' });
      const platWrap = el('div', { style: 'margin-bottom:18px;' });
      const platChecks = {};
      PLATFORMS.forEach(plat => {
        const row = el('label', { style: 'display:flex; align-items:center; gap:8px; padding:8px 12px; margin-bottom:6px; background:var(--surface-raised); border:1px solid var(--border); border-radius:8px; font-size:14px; cursor:pointer;' });
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.style.width = 'auto';
        row.appendChild(cb);
        row.appendChild(document.createTextNode(plat));
        platWrap.appendChild(row);
        platChecks[plat] = cb;
      });

      const swatchWrap = el('div', { class: 'swatches', style: 'justify-content:center; margin-bottom:24px;' });
      let selectedColor = COLOR_SWATCHES[0];
      COLOR_SWATCHES.forEach((c, i) => {
        const sw = el('div', { class: 'swatch' + (i === 0 ? ' selected' : ''), style: `background:${c};` });
        sw.addEventListener('click', () => {
          selectedColor = c;
          [...swatchWrap.children].forEach(ch => ch.classList.remove('selected'));
          sw.classList.add('selected');
          applyTheme(c);
        });
        swatchWrap.appendChild(sw);
      });

      const goBtn = el('button', { class: 'btn-primary', style: 'width:100%; padding:14px; margin-bottom:10px;' }, [document.createTextNode('Create account')]);
      goBtn.addEventListener('click', async () => {
        const name = nameInput.value.trim();
        const pass = passInput.value;
        const confirm = confirmInput.value;
        if (!name) { nameInput.style.borderColor = 'var(--danger)'; return; }
        if (!pass || pass.length < 4) { showToast('Password needs to be at least 4 characters.', true); return; }
        if (pass !== confirm) { showToast('Passwords don\'t match.', true); return; }
        const gameRanks = gamePicker.getValue();
        if (Object.keys(gameRanks).length === 0) { showToast('Pick at least one game you play.', true); return; }
        const missing = gamePicker.findMissingUsername();
        if (missing) { showToast('Enter your ' + GAMES[missing].idLabel + ' for ' + missing + '.', true); return; }
        const platforms = PLATFORMS.filter(p => platChecks[p].checked);
        if (platforms.length === 0) { showToast('Pick at least one platform.', true); return; }
        goBtn.textContent = 'Setting up…';
        // Rely on auth.js itself to say whether the username is taken — this lets
        // pre-existing usernames (set up before passwords existed) be claimed with
        // a first password instead of being permanently blocked.
        const authResult = await authCall({ action: 'register', username: name, password: pass });
        if (!authResult.ok) {
          goBtn.textContent = 'Create account';
          nameInput.style.borderColor = 'var(--danger)';
          showToast(authResult.data.error || 'Could not create account.', true);
          return;
        }
        const existing = await getKey('user:' + name, true);
        const battleTag = existing ? (existing.battleTag || '') : btInputOnboard.value.trim();
        const avatarUrl = existing ? (existing.avatarUrl || '') : avatarPicker.getValue();
        const color = existing ? (existing.color || selectedColor) : selectedColor;
        rememberUsername(name);
        await saveProfile({
          username: name, displayName: name, color, gameRanks, platforms, battleTag, avatarUrl,
          roleRanks: (gameRanks['Overwatch 2'] && gameRanks['Overwatch 2'].roleRanks) || {},
          clips: (existing && existing.clips) || []
        });
        applyTheme(color);
        startHeartbeat();
        render();
        maybePromptForNotifications();
      });
      const switchLink = el('button', { style: 'width:100%; text-align:center; color:var(--brand); font-size:13px; padding:6px;', onclick: () => { mode = 'login'; renderMode(); } }, [document.createTextNode('Already have an account? Sign in')]);

      box.appendChild(el('div', { style: 'text-align:center;' }, [nameInput, passField.element, confirmField.element, btInputOnboard]));
      box.appendChild(avatarPicker.element);
      box.appendChild(gameLabel);
      box.appendChild(gameHint);
      box.appendChild(gamePicker.element);
      box.appendChild(platLabel);
      box.appendChild(platHint);
      box.appendChild(platWrap);
      box.appendChild(el('div', { style: 'text-align:center;' }, [swatchWrap, goBtn, switchLink]));
    }

    renderMode();
    return wrap;
  }

    const results = el('div', { style: 'margin-top:8px;' });
    modal.appendChild(searchInput);
    modal.appendChild(results);

    let searchRequest = 0;
    async function showResults() {
      const requestId = ++searchRequest;
      const q = searchInput.value.trim();
      results.innerHTML = '';
      if (!q) return;
      results.appendChild(el('div', { style: 'font-size:12px; color:var(--text-tertiary); padding:8px 0;', text: 'Searching…' }));
      const users = await searchUsers(q);
      // Ignore slower searches that finished after a newer query. This prevents
      // stale results from being appended over the current search.
      if (requestId !== searchRequest || q !== searchInput.value.trim()) return;
      results.innerHTML = '';
      // Every account has its own unique username key. Display names may repeat,
      // so never collapse results by visible name or case.
      const uniqueUsers = users;
      if (!uniqueUsers.length) {
        results.appendChild(el('div', { style: 'font-size:13px; color:var(--text-tertiary); padding:10px 0;', text: 'No users found.' }));
        return;
      }
      const myFriends = await fetchFriends(profile.username);
      const myRequests = await fetchFriendRequests(profile.username);
      for (const u of uniqueUsers) {
        const already = myFriends.includes(u.username);
        const incoming = myRequests.some(r => r.from === u.username);
        const row = el('div', { style: 'display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);' }, [
          avatarEl(u, 32),
          el('div', { style: 'flex:1; min-width:0;' }, [
            el('div', { style: 'font-size:14px; font-weight:600;', text: displayNameOf(u) }),
            el('div', { style: 'font-size:11px; color:var(--text-tertiary);', text: '@' + u.username }),
            el('div', { style: 'font-size:11px; color:' + getPresence(u).color + ';', text: getPresence(u).label })
          ])
        ]);
        if (already) {
          row.appendChild(el('span', { class: 'status-pill in', text: 'Friends' }));
        } else if (incoming) {
          row.appendChild(el('button', { class: 'btn-primary', style: 'padding:7px 10px;', onclick: async () => { await acceptFriendRequest(u.username); render(); } }, [document.createTextNode('Accept')]));
        } else {
          row.appendChild(el('button', { class: 'btn-secondary', style: 'padding:7px 10px;', onclick: async () => { await sendFriendRequest(u.username); showToast('Friend request sent'); } }, [document.createTextNode('Add')]));
        }
        results.appendChild(row);
      }
    }
    let searchTimer = null;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(showResults, 220);
    });

    const requests = await fetchFriendRequests(profile.username);
    if (requests.length > 0) {
      modal.appendChild(el('div', { class: 'section-label', text: 'Pending requests' }));
      requests.forEach(r => {
        modal.appendChild(el('div', { style: 'display:flex; align-items:center; justify-content:space-between; background:var(--surface-raised); border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:8px;' }, [
          el('span', { style: 'font-size:14px;', text: r.from }),
          el('div', { style: 'display:flex; gap:6px;' }, [
            el('button', { class: 'btn-secondary', onclick: async () => { await acceptFriendRequest(r.from); render(); } }, [document.createTextNode('Accept')]),
            el('button', { class: 'danger-link', onclick: async () => { await declineFriendRequest(r.from); render(); } }, [document.createTextNode('Decline')])
          ])
        ]));
      });
    }

    const friends = await fetchFriends(profile.username);
    modal.appendChild(el('div', { class: 'section-label', text: 'Friends' }));
    if (friends.length === 0) {
      modal.appendChild(el('div', { style: 'font-size:13px; color:var(--text-tertiary);', text: 'No friends yet.' }));
    } else {
      friends.forEach(f => {
        modal.appendChild(el('div', { style: 'display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border);' }, [
          el('button', { style: 'font-size:14px; color:var(--text-primary);', onclick: () => { view.modal = 'view-profile'; view.viewProfileUser = f; render(); } }, [document.createTextNode(f)]),
          el('button', { class: 'btn-secondary', onclick: () => { view.modal = 'dm'; view.dmUser = f; render(); } }, [document.createTextNode('Message')])
        ]));
      });
    }

    if (!TIP_JAR_URL) {
      modal.appendChild(el('div', { style: 'margin-top:16px; padding:12px; border:1px solid var(--border); border-radius:10px; background:var(--surface-raised);' }, [
        el('div', { style: 'font-size:13px; font-weight:700;', text: 'Tip Jar' }),
        el('div', { style: 'font-size:11px; color:var(--text-tertiary); margin-top:3px;', text: 'Tip link is ready to connect — set TIP_JAR_URL in the source.' })
      ]));
    }

    modal.appendChild(el('div', { class: 'modal-actions' }, [
      el('button', { class: 'btn-primary', style: 'width:100%;', onclick: () => { view.modal = null; render(); } }, [document.createTextNode('Close')])
    ]));
    overlay.appendChild(modal);
    setTimeout(() => searchInput.focus(), 0);
    return overlay;

    const colorField = el('div', { class: 'field' }, [ el('label', { text: 'Accent color' }) ]);
    const swatchWrap = el('div', { class: 'swatches' });
    COLOR_SWATCHES.forEach((c) => {
      const sw = el('div', { class: 'swatch' + (c === profile.color ? ' selected' : ''), style: `background:${c};` });
      sw.addEventListener('click', () => {

        [...swatchWrap.children].forEach(ch => ch.classList.remove('selected'));

        applyTheme(c);
      });

    });

    let clips = (profile.clips || []).slice();
    const clipsList = el('div', {});

      clipsList.innerHTML = '';
      clips.forEach((clip, i) => {
        clipsList.appendChild(el('div', { style: 'display:flex; align-items:center; justify-content:space-between; background:var(--surface-raised); border:1px solid var(--border); border-radius:6px; padding:8px 10px; margin-bottom:6px;' }, [
          el('span', { style: 'font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;', text: clip.title }),
          el('button', { class: 'remove-x', onclick: () => { clips.splice(i, 1); renderClipsList(); } }, [document.createTextNode('×')])
        ]));
      });
    }
    renderClipsList();
    const clipTitleInput = el('input', { placeholder: 'Clip title', style: 'margin-bottom:6px;' });
    const clipUrlInput = el('input', { placeholder: 'Or paste a clip link (YouTube, Twitch, Medal, etc.)', style:'margin-bottom:8px;' });
    const clipFileInput = document.createElement('input');
    clipFileInput.type = 'file';
    clipFileInput.accept = 'video/*';
    clipFileInput.style.display = 'none';
    const uploadBtn = el('button', { class:'btn-primary', type:'button', style:'width:100%;' }, [document.createTextNode('Upload video from phone / computer')]);
    uploadBtn.addEventListener('click', () => clipFileInput.click());
    clipFileInput.addEventListener('change', async () => {
      const file = clipFileInput.files && clipFileInput.files[0];
      if (!file) return;
      try {
        if (!clipTitleInput.value.trim()) clipTitleInput.value = file.name.replace(/\.[^.]+$/, '');
        uploadBtn.disabled = true; uploadBtn.textContent = 'Uploading…';
        const url = await uploadVideoFile(file);
        clips.push({ id: uid(), title: clipTitleInput.value.trim() || 'Untitled clip', url, type:'video', likes:[], createdAt:Date.now() });
        clipTitleInput.value = ''; clipFileInput.value = ''; renderClipsList(); showToast('Video uploaded');
      } catch(e) { showToast(e.message, true); }
      finally { uploadBtn.disabled = false; uploadBtn.textContent = 'Upload video from phone / computer'; }
    });
    const addClipBtn = el('button', { class: 'btn-secondary', style: 'width:100%; margin-top:8px;', onclick: () => {
      const title = clipTitleInput.value.trim();
      const url = clipUrlInput.value.trim();
      if (!title || !url) { showToast('Add a title and a link.', true); return; }
      clips.push({ id: uid(), title, url, type:'link', likes:[], createdAt:Date.now() });
      clipTitleInput.value = ''; clipUrlInput.value = '';
      renderClipsList();
    }}, [document.createTextNode('Add clip link')]);
