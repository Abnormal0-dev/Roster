    clipsField.appendChild(clipTitleInput);
    clipsField.appendChild(uploadBtn);
    clipsField.appendChild(clipFileInput);
    clipsField.appendChild(clipUrlInput);
    clipsField.appendChild(addClipBtn);
    clipsField.appendChild(el('div',{style:'font-size:11px;color:var(--text-tertiary);margin-top:7px;',text:'On iPhone/Android, tapping upload opens your phone media picker. Videos are limited to 50 MB.'}));

    modal.appendChild(bioField);
    modal.appendChild(avatarField);
    modal.appendChild(colorField);
    modal.appendChild(rankField);
    modal.appendChild(btField);
    modal.appendChild(clipsField);
    modal.appendChild(pwField);

    modal.appendChild(el('div', { class: 'modal-actions' }, [
      el('button', { class: 'btn-cancel', onclick: () => { applyTheme(profile.color); view.modal = 'settings'; render(); } }, [document.createTextNode('Back')]),
      el('button', { class: 'btn-primary', onclick: async () => {
        const newName = nameInput.value.trim();
        if (!newName) return;
        const oldName = profile.username;
        const password = pwInput.value;
        if (!password) { showToast('Enter your password to save.', true); return; }

        if (newName !== oldName) {
          const taken = await isUsernameTaken(newName);
          if (taken) {
            showToast('"' + newName + '" is already taken — pick a different username.', true);
            return;
          }
          const renameResult = await authCall({ action: 'rename', username: oldName, password, newUsername: newName });
          if (!renameResult.ok) {
            showToast(renameResult.data.error || 'Could not verify your password.', true);
            return;
          }
        } else {
          // Still verify the password even when just editing other fields.
          const loginCheck = await authCall({ action: 'login', username: oldName, password });
          if (!loginCheck.ok) {
            showToast(loginCheck.data.error || 'Wrong password.', true);
            return;
          }
        }

        const gameRanks = gamePicker.getValue();
        if (Object.keys(gameRanks).length === 0) { showToast('Pick at least one game you play.', true); return; }
        const missing = gamePicker.findMissingUsername();
        if (missing) { showToast('Enter your ' + GAMES[missing].idLabel + ' for ' + missing + '.', true); return; }
        const roleRanks = (gameRanks['Overwatch 2'] && gameRanks['Overwatch 2'].roleRanks) || {};
        const battleTag = btInput.value.trim();
        const avatarUrl = avatarPicker.getValue();
        await saveProfile(Object.assign({}, profile, { username: newName, displayName: (displayInput.value.trim() || newName), bio: bioInput.value.trim(), color: selectedColor, gameRanks, roleRanks, battleTag, avatarUrl, clips }));
        if (newName !== oldName) {
          await delKey('user:' + oldName, true);
          rememberUsername(newName);
        }
        applyTheme(selectedColor);
        view.modal = 'settings'; render();
      }}, [document.createTextNode('Save')])
    ]));

    overlay.appendChild(modal);
    return overlay;
  }

    const myPost = posts.find(p => p.username === profile.username);
    wrap.appendChild(el('button', { class: 'btn-primary', style: 'width:100%; margin-bottom:16px;', onclick: () => { view.modal = 'post-board'; render(); } }, [
      iconEl(myPost ? 'gear' : 'plus'), document.createTextNode(myPost ? 'Edit your listing' : 'List yourself as looking for a squad')
    ]));
    const renderBoardPosts = async () => {
      wrap.querySelectorAll('.board-post, .empty-state').forEach(node => node.remove());
      const filteredPosts = applyBoardFilters();
      if (filteredPosts.length === 0) {
        wrap.appendChild(el('div', { class: 'empty-state' }, [
          iconEl('search', 'width:40px;height:40px;justify-content:center;'),
          el('div', { class: 'display', text: 'No matching listings' }),
          el('p', { text: 'Try a different game or rank filter.' })
        ]));
        return;
      }
      const myFavorites = await fetchFavorites();
      filteredPosts.forEach(p => {

        const mine = p.username === profile.username;
        const favorited = myFavorites.includes(p.username);
        const card = el('div', { class: 'board-post' + (mine ? ' mine' : '') }, [
          el('div', { style: 'display:flex; align-items:flex-start; justify-content:space-between;' }, [
            el('div', { class: 'who', style: 'cursor:pointer;', onclick: () => { view.modal = 'view-profile'; view.viewProfileUser = p.username; render(); } }, [
              avatarEl(p, 30),
              el('div', {}, [
                el('div', { class: 'uname', text: p.username + (mine ? ' (you)' : '') }),
                el('div', { style: 'font-size:11px; color:' + getPresence(p).color + ';', text: (getPresence(p).status === 'online' ? '● Online · ' : '') + timeAgo(p.ts) })
              ])
            ]),
            el('button', { style: 'color:' + (favorited ? 'var(--status-pending)' : 'var(--text-tertiary)') + '; font-size:18px; padding:2px 6px;', onclick: async () => { await toggleFavorite(p.username); render(); } }, [document.createTextNode(favorited ? '★' : '☆')])
          ]),
          el('div', { class: 'tags' }, [
            rankBadge(p.rank, true),
            p.game ? el('div', { class: 'tag', text: p.game }) : null,
            p.role ? el('div', { class: 'tag', text: p.role }) : null,
            p.availability ? el('div', { class: 'tag', text: p.availability }) : null
          ]),
          p.lookingFor ? el('div', { class: 'note', style: 'margin-bottom:6px;' }, [
            el('span', { style: 'color:var(--text-secondary); font-weight:600;', text: 'Looking for: ' }),
            document.createTextNode(p.lookingFor)
          ]) : null,
          p.note ? el('div', { class: 'note', text: p.note }) : null,
          (() => {
            const url = formatBattleTagUrl(p.battleTag);
            if (!url) return null;
            const wrap2 = document.createElement('div');
            wrap2.style.cssText = 'margin-top:8px;';
            const tag = document.createElement('span');
            tag.style.cssText = 'font-family:monospace; font-size:12px; color:var(--text-secondary); margin-right:8px;';
            tag.textContent = p.battleTag;
            const a = document.createElement('a');
            a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
            a.style.cssText = 'font-size:12px; color:var(--brand); text-decoration:none;';
            a.textContent = 'Search on Blizzard ↗';
            wrap2.appendChild(tag);
            wrap2.appendChild(a);
            return wrap2;
          })(),
          mine
            ? el('button', { class: 'btn-secondary', style: 'margin-top:10px; width:100%;', onclick: async () => { await removeBoardPost(p.username); render(); } }, [document.createTextNode('Remove listing')])
            : el('button', { class: 'btn-primary', style: 'margin-top:10px; width:100%;', onclick: () => { view.modal = 'dm'; view.dmUser = p.username; render(); } }, [document.createTextNode('Message — apply to join')])
        ]);
        wrap.appendChild(card);
      });
    };
    await renderBoardPosts();
    gameFilter.addEventListener('change', renderBoardPosts);
    rankFilter.addEventListener('input', renderBoardPosts);
    return wrap;
  }

  function renderBoardModal() {
    const overlay = el('div', { class: 'overlay', onclick: (e) => { if (e.target === overlay) { view.modal = null; render(); } } });
    const modal = el('div', { class: 'modal' });
    modal.appendChild(el('div', { class: 'display', text: 'List yourself' }));

    const existing = cache.board[profile.username] || {};
    // Only list games this person actually has ranks set up for — pulling from
    // gameRanks (multi-game), with a fallback for older Overwatch-only profiles.
    let myGameRanks = profile.gameRanks;
    if (!myGameRanks && profile.roleRanks && Object.keys(profile.roleRanks).length > 0) {
      myGameRanks = { 'Overwatch 2': { roleRanks: profile.roleRanks } };
    }
    myGameRanks = myGameRanks || {};
    const myGames = Object.keys(myGameRanks);

    const gameSel = document.createElement('select');
    if (myGames.length === 0) {
      const o = document.createElement('option');
      o.value = ''; o.textContent = 'No games set up — add one in Edit Profile first';
      gameSel.appendChild(o);
      gameSel.disabled = true;
    } else {
      myGames.forEach(g => {
        const o = document.createElement('option');
        o.value = g; o.textContent = g;
        if (existing.game === g) o.selected = true;
        gameSel.appendChild(o);
      });
    }

    const playingAsWrap = el('div', {});
    let subSel = null; // role/mode dropdown, only exists for games that have one

    function renderPlayingAs() {
      playingAsWrap.innerHTML = '';
      subSel = null;
      const game = gameSel.value;
      const data = myGameRanks[game];
      if (!data) return;
      if (data.roleRanks && Object.keys(data.roleRanks).length > 0) {
        subSel = document.createElement('select');
        Object.entries(data.roleRanks).forEach(([key, rank]) => {
          const o = document.createElement('option');
          o.value = key; o.textContent = key + ' — ' + formatRank(rank);
          if (existing.role === key) o.selected = true;
          subSel.appendChild(o);
        });
        playingAsWrap.appendChild(subSel);
      } else {
        playingAsWrap.appendChild(el('div', { style: 'font-size:14px; padding:10px 0;' }, [rankBadge(data.rank)]));
      }
    }
    renderPlayingAs();
    gameSel.addEventListener('change', renderPlayingAs);

    const availInput = el('input', { placeholder: 'Availability (e.g. Weeknights)', value: existing.availability || '' });
    const lookingForInput = el('input', { placeholder: 'What you need (e.g. Tank + one DPS, Gold-Plat)', value: existing.lookingFor || '' });
    const noteInput = el('textarea', { placeholder: 'Anything else', rows: '3' });
    noteInput.value = existing.note || '';

    modal.appendChild(el('div', { class: 'field' }, [ el('label', { text: 'Game' }), gameSel ]));
    modal.appendChild(el('div', { class: 'field' }, [
      el('label', { text: 'Playing as — rank fills in automatically' }),
      playingAsWrap
    ]));
    modal.appendChild(el('div', { class: 'field' }, [ el('label', { text: 'Availability' }), availInput ]));
    modal.appendChild(el('div', { class: 'field' }, [ el('label', { text: 'Requirements — what you\'re looking for' }), lookingForInput ]));
    modal.appendChild(el('div', { class: 'field' }, [ el('label', { text: 'Note' }), noteInput ]));

    modal.appendChild(el('div', { class: 'modal-actions' }, [
      el('button', { class: 'btn-cancel', onclick: () => { view.modal = null; render(); } }, [document.createTextNode('Cancel')]),
      el('button', { class: 'btn-primary', onclick: async () => {
        const game = gameSel.value;
        if (!game) { showToast('Set up a game in Edit Profile first.', true); return; }
        const data = myGameRanks[game];
        const role = subSel ? subSel.value : '';
        const rank = subSel ? (data.roleRanks && data.roleRanks[role]) : (data && data.rank);
        const gameUsername = (data && data.username) || '';
        await saveBoardPost({
          username: profile.username, game, rank: rank || null,
          role: role, availability: availInput.value.trim(),
          lookingFor: lookingForInput.value.trim(), note: noteInput.value.trim(),
          battleTag: gameUsername, avatarUrl: profile.avatarUrl || ''
        });
        view.modal = null; render();
      }}, [document.createTextNode('Post listing')])
    ]));

    overlay.appendChild(modal);
    return overlay;
  }

  // ---- boot ----
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
    // The app was already open — service worker tells us directly instead of
    // making the notification click reload anything.
    navigator.serviceWorker.addEventListener('message', (event) => {
      const msg = event.data;
      if (msg && msg.type === 'notification-click' && msg.data && msg.data.type === 'call' && msg.data.squadId) {
        if (profile) startVoiceCall(msg.data.squadId);
      }
    });
  }

  (async function boot() {
    const remembered = getRememberedUsername();
    profile = await loadProfile();
    if (profile) {
      applyTheme(profile.color);
      const pub = await getKey('user:' + profile.username, true);
      profile.tier = (pub && pub.tier) || 'free';
      startHeartbeat();
    } else if (remembered) {
      // We remember a username but couldn't load its data — likely a connection
      // hiccup, not an actual missing account. Send them to Sign in (not Create
      // account) so they don't accidentally create a duplicate over their real one.
      view = { screen: 'squads', modal: null, loginPrefill: remembered };
      showToast('Couldn\'t load your account — check your connection and sign in again.', true);
    }
    render();
    if (profile) maybePromptForNotifications();
    // Opened fresh from a call notification (?join=squadId) — jump straight in
    // instead of making them navigate to it themselves.
    const joinId = new URLSearchParams(location.search).get('join');
    if (profile && joinId) {
      history.replaceState(null, '', location.pathname);
      startVoiceCall(joinId);
    }
    // Keep the splash up for a beat so it doesn't flash-and-vanish on fast loads,
    // then fade it out once the real UI is actually rendered behind it.
    const splash = document.getElementById('splash');
    if (splash) {
      const minVisible = 700;
      setTimeout(() => {
        splash.classList.add('done');
        setTimeout(() => { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 450);
      }, minVisible);
    }
  })();
})();
</script>
</body>
</html>
